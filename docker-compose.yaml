# docker-composeはローカルだけ利用する想定。
name: keiba-app

services:
  mysql:
    image: mysql:8.4
    container_name: keiba-app-mysql
    env_file:
      - .env.local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keiba-app-backend
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    working_dir: /app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keiba-app-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app

volumes:
  mysql_data:
  backend_tmp:
  frontend_node_modules:
