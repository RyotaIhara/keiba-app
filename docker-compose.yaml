services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tmp-app-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    working_dir: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tmp-app-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app

volumes:
  backend_tmp:
  frontend_node_modules:
